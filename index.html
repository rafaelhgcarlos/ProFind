<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075c50" />
    <meta
      name="description"
      content="ProFind conecta pessoas a profissionais de confiança perto delas."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      ;(() => {
        const storageKey = 'profind-theme'
        const media = window.matchMedia('(prefers-color-scheme: dark)')
        let preference = 'system'

        try {
          const stored = window.localStorage.getItem(storageKey)
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            preference = stored
          }
        } catch {
          // O tema do sistema continua sendo aplicado sem acesso ao storage.
        }

        const resolved =
          preference === 'dark' || (preference === 'system' && media.matches)
            ? 'dark'
            : 'light'

        document.documentElement.classList.toggle('dark', resolved === 'dark')
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
    <title>ProFind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
